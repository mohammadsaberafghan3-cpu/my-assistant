name: ORION Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, orion-v1-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.orionai .
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orion-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
